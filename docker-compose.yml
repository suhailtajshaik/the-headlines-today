services:
  the-headlines-today:
    build:
      # Production is deployed from the master branch checkout.
      context: ${HEADLINES_TODAY_PROD_CONTEXT:-/home/r2d2/projects/the-headlines-today}
    container_name: the-headlines-today
    restart: unless-stopped
    ports:
      - "3333:80"
    volumes:
      # Shared Headlines Today content generated by Maxwell.
      - /home/r2d2/headlines-today:/usr/share/nginx/html/archive:ro
      - /home/r2d2/headlines-today/index.json:/usr/share/nginx/html/index.json:ro
    networks:
      - r2d2-proxy

networks:
  r2d2-proxy:
    external: true
